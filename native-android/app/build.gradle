plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def apiBase = providers.gradleProperty('phcBaseUrl').getOrElse('http://213.6.135.115/damage_assessment_system/').trim()
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
if (!apiBase.endsWith('/') || !(apiBase.startsWith('https://') || apiBase.startsWith('http://'))) {
    throw new GradleException('phcBaseUrl must be an HTTP(S) URL ending in /')
}

android {
    namespace 'com.phc.inquiry'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phc.inquiry'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', javaString(apiBase)
    }
    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            buildConfigField 'boolean', 'ALLOW_HTTP', 'true'
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'ALLOW_HTTP', 'false'
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'com.google.dagger:hilt-android:2.52'
    ksp 'com.google.dagger:hilt-compiler:2.52'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.paging:paging-runtime-ktx:3.3.5'
    implementation 'androidx.paging:paging-compose:3.3.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
