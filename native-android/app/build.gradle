plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def apiBase = providers.gradleProperty('phcBaseUrl').getOrElse('http://213.6.135.115/damage_assessment_system/').trim()
def hrApiBase = providers.gradleProperty('phcHrBaseUrl').getOrElse(apiBase).trim()
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
if (!apiBase.endsWith('/') || !(apiBase.startsWith('https://') || apiBase.startsWith('http://'))) {
    throw new GradleException('phcBaseUrl must be an HTTP(S) URL ending in /')
}
def hrUri = new URI(hrApiBase)
if (!(hrUri.scheme in ['http', 'https']) || !hrUri.host || hrUri.userInfo || hrUri.query || hrUri.fragment || !hrApiBase.endsWith('/')) {
    throw new GradleException('phcHrBaseUrl must be an HTTP(S) URL ending in / without credentials, query or fragment')
}

def attendanceNetworkResources = layout.buildDirectory.dir('generated/res/attendanceNetwork')
def generateAttendanceNetworkConfig = tasks.register('generateAttendanceNetworkConfig') {
    inputs.property('attendanceBaseUrl', hrApiBase)
    inputs.property('applicationBaseUrl', apiBase)
    outputs.dir(attendanceNetworkResources)
    doLast {
        def hosts = [new URI(apiBase), hrUri].findAll { it.scheme == 'http' }.collect { it.host }.unique()
        def destination = attendanceNetworkResources.get().file('xml/phc_network_security_config.xml').asFile
        destination.parentFile.mkdirs()
        destination.text = '<network-security-config><base-config cleartextTrafficPermitted="false" />' +
            hosts.collect { '<domain-config cleartextTrafficPermitted="true"><domain includeSubdomains="false">' + it + '</domain></domain-config>' }.join('') +
            '</network-security-config>'
    }
}

android {
    namespace 'com.phc.inquiry'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phc.inquiry'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.6.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', javaString(apiBase)
        buildConfigField 'String', 'HR_API_BASE_URL', javaString(hrApiBase)
        buildConfigField 'String', 'ARCGIS_LICENSE', javaString(providers.gradleProperty('phcArcgisLicense').getOrElse(''))
    }
    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            buildConfigField 'boolean', 'ALLOW_HTTP', 'true'
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'ALLOW_HTTP', 'true'
        }
    }
    buildFeatures { compose true; buildConfig true }
    sourceSets.main.res.srcDir(attendanceNetworkResources)
    bundle { language { enableSplit = false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

tasks.named('preBuild').configure { dependsOn(generateAttendanceNetworkConfig) }

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'com.google.dagger:hilt-android:2.52'
    ksp 'com.google.dagger:hilt-compiler:2.52'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.paging:paging-runtime-ktx:3.3.5'
    implementation 'androidx.paging:paging-compose:3.3.5'
    implementation 'com.esri:arcgis-maps-kotlin:200.6.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
